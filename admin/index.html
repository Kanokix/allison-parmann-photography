<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Allison Parmann Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0e0e0e;
      --bg-card: #161616;
      --bg-hover: #1c1c1c;
      --bg-input: #111;
      --text: #e8e4dc;
      --text-dim: #7a756d;
      --accent: #c9a96e;
      --accent-hover: #dfc088;
      --border: #222;
      --red: #c0392b;
      --green: #27ae60;
      --blue: #2980b9;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* === LOGIN === */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 3rem;
      width: 100%;
      max-width: 380px;
    }

    .login-box h1 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    .login-box p {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-bottom: 2rem;
    }

    .login-box .field {
      margin-bottom: 1.25rem;
    }

    .login-box label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    .login-box input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .login-box input:focus { border-color: var(--accent); }

    .login-box .error {
      color: var(--red);
      font-size: 0.78rem;
      margin-bottom: 1rem;
      display: none;
    }

    .btn {
      background: var(--accent);
      color: #0e0e0e;
      border: none;
      padding: 0.75rem 2rem;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover { background: var(--accent-hover); }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-outline:hover { background: var(--accent); color: #0e0e0e; }

    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 0.4rem 0.8rem;
      font-size: 0.68rem;
    }

    .btn-danger:hover { background: var(--red); color: white; }

    .btn-small {
      padding: 0.4rem 0.8rem;
      font-size: 0.68rem;
    }

    /* === DASHBOARD === */
    .dashboard { display: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .topbar h2 {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.78rem;
    }

    .topbar a:hover { color: var(--accent); }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      padding: 0 2rem;
    }

    .tab {
      padding: 1rem 1.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      font-weight: 500;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab .badge {
      background: var(--red);
      color: white;
      font-size: 0.6rem;
      padding: 0.1rem 0.4rem;
      border-radius: 8px;
      margin-left: 0.5rem;
      font-weight: 600;
    }

    .panel {
      display: none;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .panel.active { display: block; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .panel-header h3 {
      font-size: 1rem;
      font-weight: 500;
    }

    /* === CONTACTS === */
    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 0.75rem;
      transition: border-color 0.3s;
    }

    .contact-card.unread { border-left: 3px solid var(--accent); }

    .contact-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .contact-meta .name { font-weight: 500; font-size: 0.92rem; }
    .contact-meta .email { color: var(--accent); font-size: 0.82rem; }
    .contact-meta .date { color: var(--text-dim); font-size: 0.75rem; margin-left: auto; }

    .contact-subject {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .contact-message {
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.7;
      font-weight: 300;
    }

    .contact-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    /* === GALLERY === */
    .upload-area {
      background: var(--bg-card);
      border: 2px dashed var(--border);
      padding: 2rem;
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .upload-area .field { flex: 1; min-width: 150px; }

    .upload-area label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    .upload-area input,
    .upload-area select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.75rem;
      font-family: inherit;
      font-size: 0.82rem;
      outline: none;
    }

    .upload-area select { cursor: pointer; }
    .upload-area input:focus,
    .upload-area select:focus { border-color: var(--accent); }

    .gallery-admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .gallery-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .gallery-card:hover { border-color: #333; }

    .gallery-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .gallery-card-body {
      padding: 1rem;
    }

    .gallery-card-body .editable-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }

    .gallery-card-body input,
    .gallery-card-body select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      flex: 1;
    }

    .gallery-card-body select {
      max-width: 120px;
      cursor: pointer;
    }

    .gallery-card-body input:focus,
    .gallery-card-body select:focus { border-color: var(--accent); }

    .gallery-card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .featured-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .featured-toggle input { cursor: pointer; accent-color: var(--accent); }
    .featured-toggle.is-featured { color: var(--accent); }

    /* === RESPONSIVE === */
    @media (max-width: 700px) {
      .topbar { padding: 1rem; }
      .topbar-left { gap: 1rem; }
      .tabs { padding: 0 1rem; overflow-x: auto; }
      .panel { padding: 1.5rem 1rem; }
      .upload-area { flex-direction: column; align-items: stretch; }
      .gallery-admin-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .contact-meta .date { margin-left: 0; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>Admin Login</h1>
      <p>Allison Parmann Photography</p>
      <div class="error" id="loginError">Invalid username or password</div>
      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;margin-top:0.5rem">Sign In</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="topbar">
      <div class="topbar-left">
        <h2>Admin Panel</h2>
        <a href="/">View Site</a>
      </div>
      <button class="btn btn-outline btn-small" id="logoutBtn">Log Out</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-panel="contacts">
        Messages <span class="badge" id="unreadBadge" style="display:none">0</span>
      </button>
      <button class="tab" data-panel="gallery">Gallery</button>
    </div>

    <!-- CONTACTS PANEL -->
    <div class="panel active" id="contactsPanel">
      <div class="panel-header">
        <h3>Contact Form Submissions</h3>
      </div>
      <div id="contactsList"></div>
    </div>

    <!-- GALLERY PANEL -->
    <div class="panel" id="galleryPanel">
      <div class="panel-header">
        <h3>Manage Gallery</h3>
      </div>

      <div class="upload-area">
        <div class="field">
          <label>Image File</label>
          <input type="file" id="uploadFile" accept="image/*">
        </div>
        <div class="field">
          <label>Title</label>
          <input type="text" id="uploadTitle" placeholder="Photo title">
        </div>
        <div class="field">
          <label>Category</label>
          <select id="uploadCategory"></select>
        </div>
        <div class="field" id="newCatField" style="display:none">
          <label>New Category Name</label>
          <input type="text" id="newCatInput" placeholder="e.g. landscapes">
        </div>
        <button class="btn btn-small" id="uploadBtn">Upload</button>
      </div>

      <div class="gallery-admin-grid" id="galleryGrid"></div>
    </div>
  </div>

  <script>
    const API = '';

    // --- Auth ---
    async function checkAuth() {
      const res = await fetch(`${API}/api/auth-check`);
      const data = await res.json();
      if (data.authenticated) {
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadContacts();
      loadGallery();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch(`${API}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch(`${API}/api/logout`, { method: 'POST' });
      location.reload();
    });

    // --- Tabs ---
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.panel + 'Panel').classList.add('active');
      });
    });

    // --- Contacts ---
    async function loadContacts() {
      const res = await fetch(`${API}/api/admin/contacts`);
      const contacts = await res.json();
      const container = document.getElementById('contactsList');
      const badge = document.getElementById('unreadBadge');
      const unread = contacts.filter(c => !c.read).length;

      if (unread > 0) {
        badge.textContent = unread;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }

      if (contacts.length === 0) {
        container.innerHTML = '<div class="empty-state">No messages yet. They\'ll appear here when someone uses the contact form.</div>';
        return;
      }

      container.innerHTML = contacts.map(c => `
        <div class="contact-card ${c.read ? '' : 'unread'}" data-id="${c.id}">
          <div class="contact-meta">
            <span class="name">${esc(c.name)}</span>
            <span class="email">${esc(c.email)}</span>
            <span class="date">${new Date(c.date).toLocaleString()}</span>
          </div>
          <div class="contact-subject">${esc(c.subject)}</div>
          <div class="contact-message">${esc(c.message)}</div>
          <div class="contact-actions">
            ${!c.read ? `<button class="btn btn-small btn-outline" onclick="markRead(${c.id})">Mark Read</button>` : ''}
            <button class="btn-danger btn" onclick="deleteContact(${c.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function markRead(id) {
      await fetch(`${API}/api/admin/contacts/${id}/read`, { method: 'PUT' });
      loadContacts();
    }

    async function deleteContact(id) {
      if (!confirm('Delete this message?')) return;
      await fetch(`${API}/api/admin/contacts/${id}`, { method: 'DELETE' });
      loadContacts();
    }

    // --- Categories ---
    let categories = [];

    function getCategories(images) {
      const cats = new Set(images.map(img => img.category));
      // Always include defaults
      ['rodeo', 'wildlife', 'urban', 'other'].forEach(c => cats.add(c));
      return Array.from(cats).sort();
    }

    function buildCategoryOptions(selected, includeNew) {
      let opts = categories.map(c =>
        `<option value="${c}" ${c === selected ? 'selected' : ''}>${c.charAt(0).toUpperCase() + c.slice(1)}</option>`
      ).join('');
      if (includeNew) {
        opts += '<option value="__new__">+ New Category...</option>';
      }
      return opts;
    }

    function refreshUploadCategorySelect() {
      const sel = document.getElementById('uploadCategory');
      sel.innerHTML = buildCategoryOptions('', true);
      sel.addEventListener('change', () => {
        document.getElementById('newCatField').style.display =
          sel.value === '__new__' ? 'block' : 'none';
      });
    }

    function getUploadCategory() {
      const sel = document.getElementById('uploadCategory');
      if (sel.value === '__new__') {
        const val = document.getElementById('newCatInput').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        if (!val) { alert('Enter a category name'); return null; }
        return val;
      }
      return sel.value;
    }

    // --- Gallery ---
    async function loadGallery() {
      const res = await fetch(`${API}/api/admin/gallery`);
      const images = await res.json();
      const grid = document.getElementById('galleryGrid');

      categories = getCategories(images);
      refreshUploadCategorySelect();

      grid.innerHTML = images.map(img => `
        <div class="gallery-card" data-id="${img.id}">
          <img src="/${img.file}" alt="${esc(img.title)}" loading="lazy">
          <div class="gallery-card-body">
            <div class="editable-row">
              <input type="text" value="${esc(img.title)}" data-field="title" data-id="${img.id}">
            </div>
            <div class="editable-row">
              <select data-field="category" data-id="${img.id}">
                ${buildCategoryOptions(img.category, true)}
              </select>
              <button class="btn btn-small btn-outline" onclick="saveImage(${img.id})">Save</button>
            </div>
            <div class="editable-row new-cat-row" data-id="${img.id}" style="display:none">
              <input type="text" data-field="newcat" placeholder="New category name">
            </div>
            <label class="featured-toggle ${img.featured ? 'is-featured' : ''}">
              <input type="checkbox" ${img.featured ? 'checked' : ''} onchange="toggleFeatured(${img.id}, this.checked)">
              Featured on Home
            </label>
            <div class="gallery-card-actions">
              <button class="btn-danger btn" onclick="deleteImage(${img.id})">Delete</button>
            </div>
          </div>
        </div>
      `).join('');

      // Toggle new category input on each card
      grid.querySelectorAll('select[data-field="category"]').forEach(sel => {
        sel.addEventListener('change', () => {
          const id = sel.dataset.id;
          const row = grid.querySelector(`.new-cat-row[data-id="${id}"]`);
          row.style.display = sel.value === '__new__' ? 'flex' : 'none';
        });
      });
    }

    async function saveImage(id) {
      const card = document.querySelector(`.gallery-card[data-id="${id}"]`);
      const title = card.querySelector('input[data-field="title"]').value;
      let category = card.querySelector('select[data-field="category"]').value;

      if (category === '__new__') {
        const newCatInput = card.querySelector('input[data-field="newcat"]');
        category = newCatInput.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        if (!category) { alert('Enter a category name'); return; }
      }

      await fetch(`${API}/api/admin/gallery/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, category })
      });

      loadGallery();
    }

    async function deleteImage(id) {
      if (!confirm('Delete this image permanently?')) return;
      await fetch(`${API}/api/admin/gallery/${id}`, { method: 'DELETE' });
      loadGallery();
    }

    async function toggleFeatured(id, featured) {
      await fetch(`${API}/api/admin/gallery/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ featured })
      });
      loadGallery();
    }

    // --- Upload ---
    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('uploadFile');
      const title = document.getElementById('uploadTitle').value;

      if (!fileInput.files[0]) return alert('Choose a file first');

      const category = getUploadCategory();
      if (!category) return;

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);
      formData.append('title', title || fileInput.files[0].name);
      formData.append('category', category);

      const res = await fetch(`${API}/api/admin/gallery/upload`, {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        fileInput.value = '';
        document.getElementById('uploadTitle').value = '';
        loadGallery();
      } else {
        alert('Upload failed');
      }
    });

    // --- Util ---
    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Init ---
    checkAuth();
  </script>
</body>
</html>
